<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UAE Companies" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAE Companies: internships and graduate jobs in the UAE</title>
    <meta name="description" content="A simple directory of UAE companies for students and graduates, with distances, saved lists and side-by-side comparison." />
    <link rel="canonical" href="https://uaecompanies.onrender.com/" />

    <!--
      Open Graph. Without these a shared link shows title and description only:
      Telegram, WhatsApp and LinkedIn all read og:image, and there was none, so
      the preview had no picture. The image must be an absolute URL.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UAE Companies" />
    <meta property="og:url" content="https://uaecompanies.onrender.com/" />
    <meta property="og:title" content="UAE Companies: where to work in the UAE" />
    <meta property="og:description" content="A simple directory of companies for students and graduates." />
    <meta property="og:image" content="https://uaecompanies.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UAE Companies: where to work in the UAE" />
    <meta property="og:locale" content="en_AE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UAE Companies: where to work in the UAE" />
    <meta name="twitter:description" content="A simple directory of companies for students and graduates." />
    <meta name="twitter:image" content="https://uaecompanies.onrender.com/og-image.png" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Binyam Mamo" />
    <meta name="keywords" content="UAE companies, Dubai internships, graduate jobs UAE, student jobs Dubai, careers UAE, Dubai employers" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "UAE Companies",
        "url": "https://uaecompanies.onrender.com/",
        "description": "A simple directory of UAE companies for students and graduates.",
        "inLanguage": "en",
        "author": { "@type": "Person", "name": "Binyam Mamo" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Runs before first paint so there is no flash of the wrong theme or
      // the wrong accent.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('uae_theme');
          // Light by default; only an explicit choice turns it dark. Must match
          // ThemeContext, or the page flashes the other theme before hydration.
          var dark = t === 'dark';
          root.classList.toggle('dark', dark);
        } catch (e) {}

        try {
          // Values cached by applyAccentTheme(); see src/utils/accentThemes.ts.
          var vars = JSON.parse(localStorage.getItem('uae_accent_vars') || 'null');
          if (vars) {
            for (var k in vars) root.style.setProperty(k, vars[k]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans bg-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
