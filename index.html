<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAE Company Discovery & Career Intelligence | DIAC Student Platform</title>
    <meta name="description" content="Discover and organize UAE companies for internships, graduate roles, and engineering careers. Features live distance from Academic City, public transport commute times, and AI/engineering relevance." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Runs before first paint so there is no flash of the wrong theme or
      // the wrong accent.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('uae_theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
        } catch (e) {}

        try {
          // Values cached by applyAccentTheme(); see src/utils/accentThemes.ts.
          var vars = JSON.parse(localStorage.getItem('uae_accent_vars') || 'null');
          if (vars) {
            for (var k in vars) root.style.setProperty(k, vars[k]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans bg-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
